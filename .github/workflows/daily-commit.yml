name: Daily Commit

on:
  schedule:
    - cron: '0 15 * * *' # 8am PT (3pm UTC)
  workflow_dispatch: # allows manual trigger

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create daily log entry
        run: |
          mkdir -p logs
          echo "$(date +"%Y-%m-%d %H:%M:%S") - daily log" >> logs/activity.log

      - name: Commit and push
        run: |
          git config user.name "mselbekk11"
          git config user.email "32773915+mselbekk11@users.noreply.github.com"
          git add -A
          git commit -m "daily log: $(date +%Y-%m-%d)"
          git push
